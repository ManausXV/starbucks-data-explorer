{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Starbucks Data Explorer{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <span class="navbar-brand">STARBUCKS DATA EXPLORER</span>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'index' %}">Overview</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'financials' %}active{% endif %}" href="{% url 'financials' %}">Financials</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'stores' %}active{% endif %}" href="{% url 'stores' %}">Store Growth</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'menu' %}active{% endif %}" href="{% url 'menu' %}">Menu Explorer</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Stock &amp; Loyalty</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Sources</a></li>
            </ul>
        </div>
    </nav>

    {% block body %}
    {% endblock %}

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
